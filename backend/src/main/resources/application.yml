server:
  port: 8080

spring:
  application:
    name: smart-reminder

  datasource:
    url: jdbc:mysql://localhost:3306/smart_reminder?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 200565
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    listener:
      simple:
        prefetch: 10
        concurrency: 3
        max-concurrency: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# AI 推送文案配置（本地 Ollama）
reminder:
  ai:
    enabled: false               # 设为 true 启用 AI 生成
    endpoint: http://localhost:11434/api/generate
    model: qwen2.5:8b
    temperature: 0.7

  engine:
    scan-interval: 300000    # 扫描间隔(毫秒), 默认 5 分钟
    quiet-hours-start: "21:30"
    quiet-hours-end: "07:00"
    min-interval-hours: 2    # 同一用户推送最小间隔
    default-slot: "19:00-21:00"
  limits:
    self-driven: 1
    need-reminder: 2
    dropout: 3
